<!DOCTYPE html>
<meta charset='utf-8'>
<title>Test Suite</title>
<link rel='stylesheet' href='https://code.jquery.com/qunit/qunit-2.26.0.css'>
<body>

<div id='qunit'></div>
<div id='qunit-fixture'></div>
<script src='https://code.jquery.com/qunit/qunit-2.26.0.js'></script>
<script src='index.js'></script>
<script src='chrono.min.js'></script>
</body>
<script>

    QUnit.module('page', () => {

        const makeInputs = function (first, second) {

            let input_1 = document.createElement('input');
            input_1.classList.add('input', '1')
            input_1.value = first

            let input_2 = document.createElement('input');
            input_2.classList.add('input', '2')
            input_2.value = second

            return [input_1, input_2];
        };

        QUnit.test('full logic test', assert => {

            const REFERENCE = new Date(1996, 10, 22);

            const check = function (first, second, expected) {

                let actual = calcRes(makeInputs(first, second));

                if (null != expected) {
                    assert.equal(actual, expected, first + ' | ' + second);
                }

                return actual;
            };

            const checkWithRef = function (first, second, expected) {

                let actual = calcRes(makeInputs(first, second), REFERENCE);

                if (null != expected) {
                    assert.equal(actual, expected, first + ' | ' + second);
                }

                return actual;
            };

            const YEAR = '22.11.1997 Saturday November'
                , MONTH = '22.12.1996 Sunday December'
                , WEEK = '29.11.1996 Friday November'
                , DAY = '23.11.1996 Saturday November'
                , HOUR = '22.11.1996 01:00:00 Friday November'
                , MINUTE = '22.11.1996 00:01:00 Friday November'
                , SECOND = '22.11.1996 00:00:01 Friday November'
                , MONDAY = '25.11.1996 Monday November'
                , AUGUST = '05.08.2027 Thursday August'
                , TODAY = '22.11.1996 Friday November'
            ;

            check('22.11.1996', '- 40 weeks', '16.02.1996 Friday February');
            check('22.11.1996', '-40 weeks', '16.02.1996 Friday February');
            check('22.11.1996', '40 weeks', '29.08.1997 Friday August');
            check('22.11.1996', '-4 weeks 4 days', '21.10.1996 Monday October');
            check('02.05.26 22.00', '18h30m', '03.05.2026 16:30:00 Sunday May');
            check('02.05.26 22.00', '18 hours 45 minutes', '03.05.2026 16:45:00 Sunday May');
            check('22.11.1996 00.00', '3 sec', '22.11.1996 00:00:03 Friday November');
            check('22 Nov 1996', '33y', '22.11.2029 Thursday November');

            //every russian unit, in every form the keyboard can produce
            check('22.11.1996', '1 год', YEAR);
            check('22.11.1996', '1 года', YEAR);
            check('22.11.1996', '1 годы', YEAR);
            check('22.11.1996', '1 лет', YEAR);
            check('22.11.1996', '1 г', YEAR);
            check('22.11.1996', '1 месяц', MONTH);
            check('22.11.1996', '1 месяца', MONTH);
            check('22.11.1996', '1 месяцы', MONTH);
            check('22.11.1996', '1 месяцев', MONTH);
            check('22.11.1996', '1 мес', MONTH);
            check('22.11.1996', '1 неделя', WEEK);
            check('22.11.1996', '1 недели', WEEK);
            check('22.11.1996', '1 недель', WEEK);
            check('22.11.1996', '1 неделю', WEEK);
            check('22.11.1996', '1 нед', WEEK);
            check('22.11.1996', '1 н', WEEK);
            check('22.11.1996', '1 день', DAY);
            check('22.11.1996', '1 дня', DAY);
            check('22.11.1996', '1 дни', DAY);
            check('22.11.1996', '1 дней', DAY);
            check('22.11.1996', '1 д', DAY);
            check('22.11.1996', '1 час', HOUR);
            check('22.11.1996', '1 часа', HOUR);
            check('22.11.1996', '1 часы', HOUR);
            check('22.11.1996', '1 часов', HOUR);
            check('22.11.1996', '1 ч', HOUR);
            check('22.11.1996', '1 минута', MINUTE);
            check('22.11.1996', '1 минуты', MINUTE);
            check('22.11.1996', '1 минуту', MINUTE);
            check('22.11.1996', '1 минут', MINUTE);
            check('22.11.1996', '1 мин', MINUTE);
            check('22.11.1996', '1 м', MINUTE);
            check('22.11.1996', '1 секунда', SECOND);
            check('22.11.1996', '1 секунды', SECOND);
            check('22.11.1996', '1 секунду', SECOND);
            check('22.11.1996', '1 секунд', SECOND);
            check('22.11.1996', '1 сек', SECOND);
            check('22.11.1996', '1 с', SECOND);

            check('22.11.1996', '3 месяца', '22.02.1997 Saturday February');
            check('22.11.1996', '-1 неделя', '15.11.1996 Friday November');
            check('22.11.1996', '- 1 неделя', '15.11.1996 Friday November');
            check('22.11.1996', '1д', DAY);
            check('22.11.1996', '1ч30м', '22.11.1996 01:30:00 Friday November');
            check('22.11.1996', '1 день 2 часа 3 минуты', '23.11.1996 02:03:00 Saturday November');
            check('22.11.1996', '1 week 1 день', '30.11.1996 Saturday November');
            check('22.11.1996', '1 ДЕНЬ', DAY);

            //a word for now is a date, whatever it says
            assert.ok(0 !== check('сегодня', '+ 4 дня').length);
            assert.ok(0 !== check('сейчас', '+ 4 дня').length);
            assert.ok(0 !== check('щас', '+ 4 дня').length);

            //english weekday, in every case the keyboard can produce
            checkWithRef('Monday', '', MONDAY);
            checkWithRef('monday', '', MONDAY);
            checkWithRef('MONDAY', '', MONDAY);
            checkWithRef('Mon', '', MONDAY);
            checkWithRef('mon', '', MONDAY);

            //russian weekdays, in the forms a russian speaker types
            checkWithRef('понедельник', '', MONDAY);
            checkWithRef('ПОНЕДЕЛЬНИК', '', MONDAY);
            checkWithRef('в понедельник', '', MONDAY);
            checkWithRef('пн', '', MONDAY);
            checkWithRef('вторник', '', '26.11.1996 Tuesday November');
            checkWithRef('вт', '', '26.11.1996 Tuesday November');
            checkWithRef('среду', '', '27.11.1996 Wednesday November');
            checkWithRef('ср', '', '27.11.1996 Wednesday November');
            checkWithRef('четверг', '', '28.11.1996 Thursday November');
            checkWithRef('чт', '', '28.11.1996 Thursday November');

            //friday is the reference day itself, so chrono picks the day and the spellings only have to agree
            let friday = checkWithRef('Friday', '');

            assert.ok(-1 !== friday.indexOf('Friday November'), friday);
            checkWithRef('пятницу', '', friday);
            checkWithRef('пт', '', friday);

            checkWithRef('субботу', '', DAY);
            checkWithRef('сб', '', DAY);
            checkWithRef('воскресенье', '', '24.11.1996 Sunday November');
            checkWithRef('вс', '', '24.11.1996 Sunday November');

            //a weekday is a date like any other, so it takes units too
            checkWithRef('понедельник', '1 день', '26.11.1996 Tuesday November');
            checkWithRef('пн', '2 недели', '09.12.1996 Monday December');

            //short weekday forms must not fire inside a longer word
            checkWithRef('22.11.1996', '5 дней', '27.11.1996 Wednesday November');

            //months, in every case the keyboard can produce
            checkWithRef('5 August 2027', '', AUGUST);
            checkWithRef('5 august 2027', '', AUGUST);
            checkWithRef('5 AUGUST 2027', '', AUGUST);
            checkWithRef('5 aug 2027', '', AUGUST);

            //casual words, in every case the keyboard can produce
            checkWithRef('today', '', TODAY);
            checkWithRef('TODAY', '', TODAY);
            checkWithRef('Сегодня', '', TODAY);

            //two dates give a duration, whichever order they come in
            check('22.11.1996', '29.11.1996', '7 days');
            check('29.11.1996', '22.11.1996', '7 days');
            check('22.11.1996', '22.11.1996', '0 days');

            //chrono owns which friday 'next friday' is, the russian forms only have to land checkWithRef the same one
            let nextFriday = checkWithRef('next Friday', '');

            assert.ok(-1 !== nextFriday.indexOf('Friday November'), nextFriday);
            checkWithRef('следующая пятница', '', nextFriday);
            checkWithRef('след пятница', '', nextFriday);
            checkWithRef('в следующую пятницу', '', nextFriday);
            checkWithRef('СЛЕДУЮЩАЯ ПЯТНИЦА', '', nextFriday);

            //'last' points backwards, so forwardDate has to stay off for it
            let lastFriday = checkWithRef('last Friday', '');

            assert.ok(-1 !== lastFriday.indexOf('Friday November'), lastFriday);
            checkWithRef('предыдущая пятница', '', lastFriday);
            checkWithRef('в предыдущую пятницу', '', lastFriday);
            checkWithRef('пред пятница', '', lastFriday);

            //a date behind the reference must stay behind it
            assert.notEqual(lastFriday, nextFriday);

            //a period is a unit everywhere else, so it only travels as a whole phrase
            let nextWeek = checkWithRef('next week', '');

            assert.ok(0 !== nextWeek.length, nextWeek);
            checkWithRef('следующая неделя', '', nextWeek);
            checkWithRef('на следующей неделе', '', nextWeek);

            let lastMonth = checkWithRef('last month', '');

            assert.ok(0 !== lastMonth.length, lastMonth);
            checkWithRef('прошлый месяц', '', lastMonth);
            checkWithRef('в предыдущем месяце', '', lastMonth);

            let nextYear = checkWithRef('next year', '');

            assert.ok(0 !== nextYear.length, nextYear);
            checkWithRef('следующий год', '', nextYear);
            checkWithRef('в следующем году', '', nextYear);

            //a relative date is a date like any other, so it takes units too
            checkWithRef('следующий понедельник', '1 день', checkWithRef('next Monday', '1 день'));

            //a phrase must not eat the plain duration in the second field
            check('22.11.1996', '1 неделя', WEEK);

            //'через' and 'назад' carry their own number
            checkWithRef('in 1 week', '', checkWithRef('через неделю', ''));

            let inThreeDays = checkWithRef('через 3 дня', '');

            checkWithRef('in 3 days', '', inThreeDays);

            let daysAgo = checkWithRef('5 дней назад', '');

            checkWithRef('5 days ago', '', daysAgo);
            assert.notEqual(daysAgo, inThreeDays);

            //a repeat moves every day in a comma list checkWithRef by the step, and nothing else
            let twoDays = check('22.11.1996, 23.11.1996', '* 2 d', '24.11.1996, 25.11.1996')
                , everyWeek = check('22.11.1996, 23.11.1996', 'every week', '29.11.1996, 30.11.1996')
                , everyThree = check('22.11.1996, 23.11.1996', 'every 3 days', '25.11.1996, 26.11.1996')
            ;

            check('22.11.1996, 23.11.1996, 24.11.1996', '* 2 days', '24.11.1996, 25.11.1996, 26.11.1996');
            check('22.11.1996, 25.11.1996', '* 1 day', '23.11.1996, 26.11.1996');
            check('22.11.1996', '* 2 days', '24.11.1996');
            check('22.11.1996, 23.11.1996', 'каждые 3 дня', everyThree);
            check('22.11.1996, 23.11.1996', 'x2 weeks', '06.12.1996, 07.12.1996');

            //a repeat has no direction and cannot stand still
            check('22.11.1996, 23.11.1996', '* -2 days', twoDays);

            check('22.11.1996, 23.11.1996', 'every day', '23.11.1996, 24.11.1996');
            check('22.11.1996, 23.11.1996', 'every month', '22.12.1996, 23.12.1996');
            check('22.11.1996, 23.11.1996', '* 1 week 2 days', '01.12.1996, 02.12.1996');
            check('22.11.1996, 23.11.1996', '', '22.11.1996, 23.11.1996');
            check('', '* 2 days', '');
            checkWithRef('December 25, 2026', '');
            check('22.11.1996', '* nonsense', '');
            check('22.11.1996, 23.11.1996', '* week', everyWeek);
            check('22.11.1996, 23.11.1996', '* 2 d', twoDays);

            //'today' moves, so the answer is built the way the app builds it
            check('today, tomorrow', '* 2 d',
                moment().add(2, 'days').format('DD.MM.YYYY') + ', ' + moment().add(3, 'days').format('DD.MM.YYYY'));

            //a run of days written the short way, and the shortest run that is still written out
            let range = check('22.11.1996 - 25.11.1996', '', '22.11.1996 - 25.11.1996');

            check('22.11.1996 - 24.11.1996', '', '22.11.1996, 23.11.1996, 24.11.1996');

            //a range has two ends and no direction, and takes any dash the keyboard offers
            check('25.11.1996 - 22.11.1996', '', range);
            check('22.11.1996 — 25.11.1996', '', range);

            //an end of a range is a date like any other
            checkWithRef('today - 25.11.1996', '', range);
            checkWithRef('сегодня - 25.11.1996', '', range);

            //a typed list that turns out to be a run comes back as one, a broken one does not
            check('22.11.1996, 23.11.1996, 24.11.1996, 25.11.1996', '', range);
            check('22.11.1996, 24.11.1996, 25.11.1996, 26.11.1996', '', '22.11.1996, 24.11.1996, 25.11.1996, 26.11.1996');

            //a dash inside a date is part of the date
            check('1996-11-22', '', TODAY);
            assert.ok(-1 === check('25-12-2026', '').indexOf(' - '), 'a dashed date is not a range');

            //a range is a block: it comes round after the block itself, and then the step
            let block = check('22.11.1996 - 25.11.1996', '* 1 day', '27.11.1996 - 30.11.1996');

            check('22.11.1996 - 25.11.1996', '* 4 d', '30.11.1996 - 03.12.1996');

            //the spaces around the dash are how it reads best, not how it has to be typed
            check('22.11.1996-25.11.1996', '* 1 day', block);
            check('22.11.1996-25.11.1996', '', range);
            //every russian month, in the form a russian speaker types
            checkWithRef('5 января 1997', '', '05.01.1997 Sunday January');
            checkWithRef('5 февраля 1997', '', '05.02.1997 Wednesday February');
            checkWithRef('5 марта 1997', '', '05.03.1997 Wednesday March');
            checkWithRef('5 апреля 1997', '', '05.04.1997 Saturday April');
            checkWithRef('5 мая 1997', '', '05.05.1997 Monday May');
            checkWithRef('5 июня 1997', '', '05.06.1997 Thursday June');
            checkWithRef('5 июля 1997', '', '05.07.1997 Saturday July');
            checkWithRef('5 августа 1997', '', '05.08.1997 Tuesday August');
            checkWithRef('5 сентября 1997', '', '05.09.1997 Friday September');
            checkWithRef('5 октября 1997', '', '05.10.1997 Sunday October');
            checkWithRef('5 ноября 1997', '', '05.11.1997 Wednesday November');
            checkWithRef('5 декабря 1997', '', '05.12.1997 Friday December');

            //the short form of every month
            checkWithRef('5 янв 1997', '', '05.01.1997 Sunday January');
            checkWithRef('5 фев 1997', '', '05.02.1997 Wednesday February');
            checkWithRef('5 мар 1997', '', '05.03.1997 Wednesday March');
            checkWithRef('5 апр 1997', '', '05.04.1997 Saturday April');
            checkWithRef('5 май 1997', '', '05.05.1997 Monday May');
            checkWithRef('5 июн 1997', '', '05.06.1997 Thursday June');
            checkWithRef('5 июл 1997', '', '05.07.1997 Saturday July');
            checkWithRef('5 авг 1997', '', '05.08.1997 Tuesday August');
            checkWithRef('5 сен 1997', '', '05.09.1997 Friday September');
            checkWithRef('5 окт 1997', '', '05.10.1997 Sunday October');
            checkWithRef('5 ноя 1997', '', '05.11.1997 Wednesday November');
            checkWithRef('5 дек 1997', '', '05.12.1997 Friday December');

            //one month written every way the keyboard can produce
            const SEPTEMBER = '05.09.1997 Friday September';

            checkWithRef('5 September 1997', '', SEPTEMBER);
            checkWithRef('5 of September 1997', '', SEPTEMBER);
            checkWithRef('5th of September 1997', '', SEPTEMBER);
            checkWithRef('5 сентября 1997', '', SEPTEMBER);
            checkWithRef('5 сентябрь 1997', '', SEPTEMBER);
            checkWithRef('5 сент 1997', '', SEPTEMBER);
            checkWithRef('5 СЕНТЯБРЯ 1997', '', SEPTEMBER);

            //the day carries its own tail in russian
            checkWithRef('5е сентября 1997', '', SEPTEMBER);
            checkWithRef('5-е сентября 1997', '', SEPTEMBER);
            checkWithRef('5-го сентября 1997', '', SEPTEMBER);
            checkWithRef('5ое сентября 1997', '', SEPTEMBER);

            //a month with no year is read off the reference, forwards
            checkWithRef('5 декабря', '', '05.12.1996 Thursday December');
            checkWithRef('5 января', '', '05.01.1997 Sunday January');

            //a month is a date like any other, so both fields take one
            checkWithRef('5 мая 1997', '1 день', '06.05.1997 Tuesday May');
            checkWithRef('5 мая 1997', '12 мая 1997', '7 days');
            checkWithRef('5е мая 1997', '', '05.05.1997 Monday May');

            //a month with no day is a date too, the russian form only has to land on the same one
            let september = checkWithRef('September 1997', '');

            assert.ok(0 !== september.length, september);
            checkWithRef('сентябрь 1997', '', september);
            checkWithRef('в сентябре 1997', '', september);

            //a month name must not swallow the unit that sounds like it
            check('22.11.1996', '1 месяц', MONTH);
            check('22.11.1996', '1 м', MINUTE);
            check('22.11.1996', '1 г', YEAR);
            check('22.11.1996', '1 д', DAY);
            check('22.11.1996', '1 с', SECOND);
        })

        QUnit.test('format duration test', assert => {
            //GIVEN
            let dates1 = [parseDate('22.11.1996 18:18').start.moment(), parseDate('22.11.2025 18:18').start.moment()]
                , dates2 = [parseDate('22.11.1996 18:18').start.moment(), parseDate('22.11.2024 18:18').start.moment()]
                , dates3 = [parseDate('10.02.26').start.moment(), parseDate('10.01.26').start.moment()]
                , dates4 = [parseDate('10.02.26').start.moment(), parseDate('13.03.26').start.moment()]

            let case1 = moment.duration('-PT245542H22M4.365S')
                , case2 = moment.duration('PT245240H00M0.000S')
                , case3 = moment.duration('-PT000002H22M1.111S')
                , case4 = moment.duration(makeDiff(dates1[0], dates1[1]))
                , case5 = moment.duration(makeDiff(dates2[0], dates2[1]))
                , case6 = moment.duration(makeDiff(dates3[0], dates3[1]))
                , case7 = moment.duration(makeDiff(dates4[0], dates4[1]))
            ;

            //WHEN
            let
                result1 = formatDuration(case1, null, null)
                , result2 = formatDuration(case2, null, null)
                , result3 = formatDuration(case3, null, null)
                , result4 = formatDuration(case4, dates1[0], dates1[1])
                , result5 = formatDuration(case5, dates2[0], dates2[1])
                , result6 = formatDuration(case6, dates3[0], dates3[1])
                , result7 = formatDuration(case6, null, null, true)
            ;

            //THEN
            assert.equal(result1, '28 years 3 days 22 hours 22 minutes 4 seconds');
            assert.equal(result2, '27 years 11 months 21 days 8 hours');
            assert.equal(result3, '2 hours 22 minutes 1 seconds');
            assert.equal(result4, '29 years');
            assert.equal(result5, '28 years');
            assert.equal(result6, '1 months');
            assert.equal(result7, '31 days');
        })

        QUnit.test('additional format for sec and min test', assert => {
            //GIVEN
            let case1 = 'min'
                , case2 = 'sec'
                , case3 = 'minutes'
                , case4 = 'seconds'
                , case5 = 'second'
                , case6 = 'minute'
                , case7 = 'sunday'
            ;

            //WHEN
            let result1 = formatUnits(case1)
                , result2 = formatUnits(case2)
                , result3 = formatUnits(case3)
                , result4 = formatUnits(case4)
                , result5 = formatUnits(case5)
                , result6 = formatUnits(case6)
                , result7 = formatUnits(case7)
            ;

            //THEN
            assert.equal(result1, 'minutes');
            assert.equal(result2, 'seconds');
            assert.equal(result3, 'minutes');
            assert.equal(result4, 'seconds');
            assert.equal(result5, 'seconds');
            assert.equal(result6, 'minutes');
            assert.equal(result7, 'sunday');
        })

        QUnit.test('fixing moment dates depending on args', assert => {
            //GIVEN
            let case1 = chrono.parse('today')[0]
                , case2 = chrono.parse('now')[0]
                , case3 = chrono.parse('2024-12-09 19:08:28')[0]
                , case4 = chrono.parse('22.11.1996')[0]
            ;

            let case1_moment_date = case1.start.moment()
                , case2_moment_date = case2.start.moment()
                , case3_moment_date = case3.start.moment()
                , case4_moment_date = case4.start.moment()
            ;

            //WHEN
            let result1 = fixDate(case1, case1.start.moment())
                , result2 = fixDate(case2, case2.start.moment())
                , result3 = fixDate(case3, case3.start.moment())
                , result4 = fixDate(case4, case4.start.moment())
            ;

            //THEN
            assert.deepEqual(result1, case1_moment_date.startOf('day'));
            assert.deepEqual(result2, case2_moment_date);
            assert.deepEqual(result3, case3_moment_date);
            assert.deepEqual(result4, case4_moment_date);
        })

        QUnit.test('get operation test', assert => {
            //GIVEN
            let case1 = '1y'
                , case2 = '1 year'
                , case3 = '3 years'
                , case4 = '2 min'
                , case5 = '28 minutes 10 seconds'
                , case6 = '28 years 10 months'
                , case7 = '28 years 1 months 10 days 11 hours 51 minutes 5 seconds'
                , case8 = '1 months 28 years 10 days 51 minutes 11 hours 5 seconds'
                , case9 = '2M 1y'
                , case10 = '2 weeks 1 year'
            ;

            //WHEN
            let result1 = getOperations(case1)
                , result2 = getOperations(case2)
                , result3 = getOperations(case3)
                , result4 = getOperations(case4)
                , result5 = getOperations(case5)
                , result6 = getOperations(case6)
                , result7 = getOperations(case7)
                , result8 = getOperations(case8)
                , result9 = getOperations(case9)
                , result10 = getOperations(case10)
            ;

            //THEN
            assert.deepEqual(result1, [{num: 1, unit: 'year'}]);
            assert.deepEqual(result2, [{num: 1, unit: 'year'}]);
            assert.deepEqual(result3, [{num: 3, unit: 'years'}]);
            assert.deepEqual(result4, [{num: 2, unit: 'minutes'}]);
            assert.deepEqual(result5, [{num: 10, unit: 'seconds'}, {num: 28, unit: 'minutes'}]);
            assert.deepEqual(result6, [{num: 10, unit: 'months'}, {num: 28, unit: 'years'}]);
            assert.deepEqual(result7, [{num: 5, unit: 'seconds'}, {num: 51, unit: 'minutes'}, {num: 11, unit: 'hours'}, {num: 10, unit: 'days'},  {num: 1, unit: 'months'}, {num: 28, unit: 'years'}]);
            assert.deepEqual(result8, [{num: 5, unit: 'seconds'}, {num: 51, unit: 'minutes'}, {num: 11, unit: 'hours'}, {num: 10, unit: 'days'},  {num: 1, unit: 'months'}, {num: 28, unit: 'years'}]);
            assert.deepEqual(result9, [{num: 2, unit: 'months'}, {num: 1, unit: 'year'}]);
            assert.deepEqual(result10, [{num: 2, unit: 'weeks'}, {num: 1, unit: 'year'}]);
        })

    });

</script>
