    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "Date Calculator",
            "url": "https://vjattich.github.io/date-calculator/",
            "applicationCategory": "UtilitiesApplication",
            "operatingSystem": "Any browser",
            "browserRequirements": "Requires JavaScript",
            "inLanguage": ["en", "ru", "uk", "fr", "nl", "de", "es", "pt", "it", "fi", "sv", "ja", "vi", "zh-Hant"],
            "description": "Date calculator that reads any date format and dates written in plain words, adds or subtracts days, weeks, months and hours, and counts the time between two dates. The answer is always shown as numbers with the weekday and month spelled out in English.",
            "featureList": [
                "Numeric dates in any order: 25.12.2026, 2026-12-25, 12/25/2026, 25-12-2026",
                "Time with dates: 25.12.2026 00.00, 2026-12-25 00:00:00, 12/25/2026 00:00, 25-12-2026",
                "Plain words: today, next Friday, \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0443\u044e \u043f\u044f\u0442\u043d\u0438\u0446\u0443, \u0447\u0435\u0440\u0435\u0437 3 \u0434\u043d\u044f",
                "Add or subtract years, months, weeks, days, hours, minutes and seconds",
                "Count the time between two dates",
                "Build a repeating pattern from picked days and get the next date it falls on",
                "Share any answer as a link"
            ],
            "isAccessibleForFree": true,
            "author": {"@type": "Person", "name": "Vjattich", "url": "https://github.com/Vjattich"}

    <style>

        :root {
            --bg: orange;
            --ink: #1c1200;
            --cell: #ffb64d;
            --cell-hover: #ffca7a;
            --range: #d98200;
            --faint: #b8791a;
            --muted: #8a5a00;
            --radius: 8px;
            --line: 2px;
        }

        html {
            font-size: 16px;
        }

        html, body {
            font-family: sans-serif;
            color: var(--ink);
        }

        input, button, textarea, select {
            font-family: inherit;
        }

        .box30 {
            width: 30px;
            height: 30px;
        }

        .input-row {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }

        .share-holder {
            position: relative;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .share-btn-style, .calendar-btn-style {
            background: none;
            border: 0;
            padding: 0;
            line-height: 0;
            cursor: pointer;
        }

        .share, .calendar {
            transition: transform 0.1s ease-in;
        }

        .share-btn-style:active .share, .calendar-btn-style:active .calendar {
            transform: scale(0.9);
        }

        .copy-text {
            position: absolute;
            left: 100%;
            margin-left: 0.5em;
            font-size: 0.7rem;
        }

        .actions {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8em;
            margin-left: 0.7em;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .calendar-holder {
            transition: opacity 0.3s ease, visibility 0.3s ease;
            display: flex;
            align-items: center;
        }

        #timezone {
            display: block;
            margin-top: 0.4em;
            font-size: 0.7em;
            color: var(--muted);
        }

        .calendar-block {
            position: relative;
            width: fit-content;
            margin: 3em auto 0;
        }

        .calendar-view {
            width: fit-content;
            margin: 0 auto;
            font-size: 0.8rem;
            user-select: none;
        }

        .cal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5em;
            margin-bottom: 0.5em;
        }

        .cal-title {
            font-weight: bold;
        }

        .cal-nav {
            background: none;
            border: 0;
            padding: 0 0.5em;
            color: inherit;
            font-size: 1.3em;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.1s ease-in;
        }

        .cal-nav:active {
            transform: scale(0.8);
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 2.2em);
            gap: 0.2em;
        }

        .cal-dow {
            font-size: 0.75em;
            line-height: 2;
            text-align: center;
            color: var(--muted);
        }

        .cal-day {
            padding: 0;
            border: 0;
            background: var(--cell);
            color: inherit;
            font: inherit;
            line-height: 2.2em;
            text-align: center;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            transition: background 0.1s ease-in, transform 0.1s ease-in;
        }

        .cal-day:hover {
            background: var(--cell-hover);
        }

        .cal-day:active {
            transform: scale(0.88);
        }

        .cal-out {
            background: none;
            color: var(--faint);
        }

        /* a span end, and a repeat the step produced, read the same */
        .cal-range, .cal-pattern {
            background: var(--range);
        }

        .cal-today {
            box-shadow: inset 0 0 0 1px var(--ink);
        }

        .cal-sel, .cal-sel:hover {
            background: var(--ink);
            color: var(--bg);
        }

        #tutorial-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 50;
        }

        #tutorial-arrows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .tutorial-arrow {
            fill: none;
            stroke: var(--ink);
            stroke-width: 2.4;
            stroke-linecap: round;
        }

        .tutorial-arrow-head {
            fill: var(--ink);
            stroke: none;
            opacity: 0;
        }

        .tutorial-tip {
            will-change: opacity, transform;
            position: absolute;
            max-width: 13em;
            padding: 0.45em 0.7em;
            border-radius: var(--radius);
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            font-size: 0.85em;
            line-height: 1.3;
            text-align: center;
            opacity: 0;
            transform: translateY(0.4em) scale(0.96);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tutorial-tip.show {
            opacity: 1;
            transform: none;
        }

        .tutorial-tip-body {
            display: block;
        }

        .tutorial-key {
            display: inline-block;
            margin-top: 0.45em;
            padding: 0.1em 0.6em;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            background: #f2f2f2;
            box-shadow: 0 2px 0 #8f8f8f;
            color: var(--ink);
            font-size: 0.75em;
            line-height: 1.6;
            transition: transform 90ms ease, box-shadow 90ms ease;
        }

        .tutorial-key.tutorial-key-down {
            transform: translateY(2px);
            box-shadow: 0 0 0 #8f8f8f;
        }

        .share.tutorial-press, .calendar.tutorial-press {
            transform: scale(0.85);
        }

        body.tutorial-on #main {
            pointer-events: none;
            user-select: none;
        }

        .input.tutorial-enter {
            animation: tutorial-press 0.4s ease-out;
        }

        @keyframes tutorial-press {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.97);
                background: #ffe9c2;
            }
            100% {
                transform: scale(1);
            }
        }

        #tutorial-counter {
            font-size: 0.8em;
        }

        @media (prefers-reduced-motion: reduce) {

            .tutorial-tip, .tutorial-arrow, .tutorial-key {
                transition: none;
            }

            .input.tutorial-enter {
                animation: none;
            }

            .result, .actions, .calendar-holder, .calendar-view, .cal-day, .cal-nav {
                transition: none;
            }
        }

        /* readable by search engines and screen readers, out of the way of the design */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }

        .input {
            min-width: 6em;
            min-height: 1em;
            width: 8em;
            border: var(--line) solid var(--ink);
            padding: 0.15em 0.4em;
            transition: all 0.1s ease-in;
            font-size: 1em;
        }

        /* a comma list of picked days needs more room than a single date */
        .input.input-wide {
            width: 20em;
            max-width: calc(100vw - 8rem);
        }

        .font-size-20 {
            font-size: 20px;
        }

        .margin-top-15p {
            margin-top: 10%
        }

        .center {
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .background-orange {
            background: var(--bg);
        }

        hr {
            display: block;
            text-align: center;
            width: 8em;
            border: 0;
            border-top: 0.1em solid #123455;
            margin: 0.3em auto;
            padding: 0;
        }

        .guide {
            transition: opacity 1s;
        }

        .result {
            width: fit-content;
            max-width: 100%;
            margin: 1.2em auto 6em;
            transition: opacity 0.3s ease;
        }

        .result.result-out {
            opacity: 0;
        }

        .result-span {
            font-size: 20px;
        }

        .opacity-0 {
            opacity: 0;
        }

        .opacity-1 {
            opacity: 1;
        }

        .tooltip-right-up, .tooltip-right-down, .tooltip-left-up, .tooltip-result {
            position: absolute;
            padding: 5px;
            width: auto;
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            z-index: 1;
            transition: opacity 0.5s;
        }

        .tooltip-right-up {
            margin-top: -1.8em;
            margin-left: 8.7em;
            border-radius: var(--radius) var(--radius) var(--radius) 0;
        }

        .tooltip-right-down {
            margin-top: 1.8em;
            margin-left: 8.7em;
            border-radius: 0 var(--radius) var(--radius) var(--radius);
        }

        .tooltip-left-up {
            margin-top: -3rem;
            margin-left: -30rem;
            border-radius: var(--radius) var(--radius) 0 var(--radius);
        }

        .tooltip-result {
            margin-top: 5em;
            margin-left: -12em;
            border-radius: var(--radius) 0 var(--radius) var(--radius);
        }

        .hidden {
            visibility: hidden
        }

        .actions.hidden, .calendar-holder.hidden {
            opacity: 0;
        }

        /* the guide points at these, so it needs them on screen even with no result */
        body.tutorial-on .actions.hidden, body.tutorial-on .calendar-holder.hidden {
            visibility: visible;
            opacity: 1;
        }

        @media screen and (max-width: 768px) {

            html {
                font-size: 14px;
            }

            body {
                zoom: 100% !important;
                padding: 1rem;
            }

            .margin-top-15p {
                margin-top: 5%;
            }

            .input {
                width: calc(100vw - 8rem);
                max-width: 20em;
                margin-bottom: 0.5rem;
            }

            div:has(.input) {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }

            .tutorial-tip {
                max-width: 70vw;
                font-size: 12px;
            }

            #tutorial-arrows {
                display: none;
            }

            .copy-text {
                top: 100%;
                left: auto;
                right: 0;
                margin-top: 0.4em;
                margin-left: 0;
            }

            .actions {
                margin-left: 0.4em;
            }

            .calendar-block {
                margin: 2em auto 0;
            }

            .result {
                margin: 1em auto 5em;
            }

            .calendar-view {
                font-size: 0.9rem;
            }

            .cal-grid {
                grid-template-columns: repeat(7, 2.6em);
            }

            .tooltip-right-up, .tooltip-right-down, .tooltip-left-up, .tooltip-result {
                font-size: 12px;
                margin-left: 0;
                width: 90%;
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                border-radius: var(--radius);
            }

            .tooltip-left-up {
                margin-top: -1.5rem;
            }

            .tooltip-right-up {
                margin-top: 2.7rem;
            }

            .tooltip-right-down {
                margin-top: 7.5rem;
            }

            .tooltip-result {
                margin-top: 12rem;
            }

            div:has(br) {
                height: 0.5em; /* Smaller space on mobile */
            }
        }

        @media screen and (max-width: 200px), screen and (max-height: 200px) {

            #main {
                display: none
            }

        }
    </style>
</head>
<body class="background-orange" style="zoom: 125%">
<div id="tutorial-layer">
    <svg id="tutorial-arrows" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="tutorial-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--ink)"/>
            </marker>
        </defs>
    </svg>
</div>
<div class="center margin-top-15p font-size-20">
    <main id="main" style="flex: 1 1 auto">
        <h1 class="visually-hidden">Date calculator: add days to a date or count the days between two dates</h1>
        <noscript>

        </noscript>
        <div id="tooltips">

        </div>
        <div class="input-row">
            <input class="input 1" type="text" autocomplete="off" autocorrect="off" spellcheck="false"
                   aria-label="Date in any format, for example 25.12.2026, 2026-12-25 or next Friday. Several dates can be listed with commas"><span
                style="margin: 0 0.15em;"></span><input class="input 2" type="text" autocomplete="off"
                                                        autocorrect="off" spellcheck="false"
                                                        aria-label="Second date, an amount such as 3 days, or a repeat such as * 2 days">
            <span id="date-tooltip" class="tooltip-left-up opacity-0">Can't read this date</span>
        </div>
        <div class="calendar-block">
            <div id="calendar-view" class="calendar-view"></div>
            <div class="actions hidden">

                    <span id="copy-text" class="copy-text hidden">Copied!</span>
                </div>
                <div id="calendar-holder" class="calendar-holder hidden">
                    <button id="calendar-btn" class="calendar-btn-style" aria-label="Add result to Google Calendar"><svg class="box30 calendar" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18"/><path d="M8 2.5v4"/><path d="M16 2.5v4"/><text x="12" y="18.6" fill="var(--ink)" stroke="none" font-size="10" font-weight="700" text-anchor="middle">G</text></svg></button>
                </div>
            </div>
        </div>
        <div class="result">
            <span class="result-span" id="result"></span>
            <span id="timezone"></span>
        </div>
    </main>
</div>
<script src="footer.js" data-repo="https://github.com/Vjattich/date-calculator" data-guide defer></script>
<script src="index.js" defer></script>
<script src="tutorial.js" defer></script>
<script src="chrono.min.js" defer></script>
</body>
</html>
