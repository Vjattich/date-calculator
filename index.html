<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta charset="utf-8">
    <link rel="icon" href="calendar.png">
    <title>Date calculator</title>
    <style>

        html, body {
            font-family: sans-serif;
        }

        input, button, textarea, select {
            font-family: inherit;
        }

        .box30 {
            width: 30px;
            height: 30px;
        }

        .input-row {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }

        .guide-nav {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 10px;
            display: none;
            transition: transform 0.1s ease;
            user-select: none;
            align-items: center;
            justify-content: center;
            height: 40px;
            flex-shrink: 0;
        }

        .guide-nav svg {
            display: block;
        }

        .guide-nav:active {
            transform: scale(0.85);
        }


        .share-holder {
            position: absolute;
            left: 100%;
            top: 100%;
            margin-top: 0.4em;
            margin-left: 0.5em;
            display: flex;
            align-items: center;
            gap: 0.5em;
            white-space: nowrap;
            z-index: 1;
        }

        .share-btn-style {
            background: none;
            border: 0;
            padding: 0;
            line-height: 0;
            cursor: pointer;
        }

        .share {
            transition: transform 0.1s ease-in;
        }

        .share-btn-style:active .share {
            transform: scale(0.9);
        }

        .copy-text {
            font-family: sans-serif;
            font-size: 0.9em;
        }

        .calendar-holder {
            transition: opacity 0.3s ease, visibility 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: right;
            margin-top: 0.8em;
        }

        .calendar-btn-style {
            background: none;
            border: 0;
            padding: 0;
            line-height: 0;
            cursor: pointer;
        }

        .calendar {
            transition: transform 0.1s ease-in;
        }

        .calendar-btn-style:active .calendar {
            transform: scale(0.9);
        }

        #timezone {
            display: block;
            margin-top: 0.4em;
            font-size: 0.7em;
            opacity: 0.7;
        }


        #tutorial-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 50;
        }

        #tutorial-arrows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .tutorial-arrow {
            fill: none;
            stroke: #000000;
            stroke-width: 2.4;
            stroke-linecap: round;
        }

        .tutorial-arrow-head {
            fill: #000000;
            stroke: none;
            opacity: 0;
        }

        .tutorial-tip {
            will-change: opacity, transform;
            position: absolute;
            max-width: 13em;
            padding: 0.45em 0.7em;
            border-radius: 10px;
            border: 1px solid #aeaeae;
            background-color: black;
            color: orange;
            font-family: sans-serif;
            font-size: 0.85em;
            line-height: 1.3;
            text-align: center;
            opacity: 0;
            transform: translateY(0.4em) scale(0.96);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tutorial-tip.show {
            opacity: 1;
            transform: none;
        }

        .tutorial-tip-body {
            display: block;
        }

        .tutorial-key {
            display: inline-block;
            margin-top: 0.45em;
            padding: 0.1em 0.6em;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            background: #f2f2f2;
            box-shadow: 0 2px 0 #8f8f8f;
            color: #000000;
            font-family: sans-serif;
            font-size: 0.75em;
            line-height: 1.6;
            transition: transform 90ms ease, box-shadow 90ms ease;
        }

        .tutorial-key.tutorial-key-down {
            transform: translateY(2px);
            box-shadow: 0 0 0 #8f8f8f;
        }

        .share.tutorial-press, .calendar.tutorial-press {
            transform: scale(0.85);
        }

        #icon-x {
            display: none;
        }

        body.tutorial-on #icon-question {
            display: none;
        }

        body.tutorial-on #icon-x {
            display: block;
        }

        body.tutorial-on .guide-nav {
            display: flex;
        }

        body.tutorial-on #main {
            pointer-events: none;
            user-select: none;
        }

        .input.tutorial-enter {
            animation: tutorial-press 0.4s ease-out;
        }

        @keyframes tutorial-press {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.97);
                background: #ffe9c2;
            }
            100% {
                transform: scale(1);
            }
        }

        #tutorial-counter {
            font-family: sans-serif;
            font-size: 0.8em;
        }

        @media (prefers-reduced-motion: reduce) {

            .tutorial-tip, .tutorial-arrow, .tutorial-key {
                transition: none;
            }

            .input.tutorial-enter {
                animation: none;
            }

            .result, .calendar-holder {
                transition: none;
            }
        }

        .box40 {
            width: 40px;
            height: 40px;
        }

        html {
            font-size: 16px;
        }

        footer {
            position: fixed;
            bottom: 1em;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5em;
            padding: 0 1em;
            z-index: 10;
        }

        .input {
            min-width: 6em;
            min-height: 1em;
            width: 8em;
            border: 0.2em solid;
            transition: all 0.1s ease-in;
            font-size: 1em;
        }

        .font-size-20 {
            font-size: 20px;
        }

        .margin-top-15p {
            margin-top: 15%
        }

        .center {
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .background-orange {
            background: orange;
        }

        .qr {
            width: 40px;
            height: 40px;
            margin: 5px 5px 5px 5px;
        }

        hr {
            display: block;
            text-align: center;
            width: 8em;
            border: 0;
            border-top: 0.1em solid #123455;
            margin: 0.3em auto;
            padding: 0;
        }

        .guide {
            font-family: sans-serif;
            -webkit-transition: opacity 1s;
            -moz-transition: opacity 1s;
            -o-transition: opacity 1s;
            transition: opacity 1s;
        }

        .result {
            width: fit-content;
            max-width: 100%;
            margin: 1.5em auto 0;
            transition: opacity 0.3s ease;
        }

        .result.result-out {
            opacity: 0;
        }

        .result-span {
            font-size: 20px;
        }

        .opacity-0 {
            opacity: 0;
        }

        .opacity-1 {
            opacity: 100;
        }

        .tooltip-right-up {
            position: absolute;
            padding: 5px;
            margin-top: -1.8em;
            margin-left: 8.7em;
            width: auto;
            border-radius: 10px 10px 10px 0px;
            border: 1px solid #aeaeae;
            background-color: black;
            color: orange;
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-right-down {
            position: absolute;
            padding: 5px;
            margin-top: 1.8em;
            margin-left: 8.7em;
            width: auto;
            border-radius: 0px 10px 10px 10px;
            border: 1px solid #aeaeae;
            background-color: black;
            color: orange;
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-result {
            position: absolute;
            padding: 5px;
            margin-top: 5em;
            margin-left: -12em;
            width: auto;
            border-radius: 10px 0px 10px 10px;
            border: 1px solid #aeaeae;
            background-color: black;
            color: orange;
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-left-up {
            position: absolute;
            padding: 5px;
            margin-top: -3rem;
            margin-left: -30rem;
            width: auto;
            border-radius: 10px 10px 0px 10px;
            border: 1px solid #aeaeae;
            background-color: black;
            color: orange;
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .hidden {
            visibility: hidden
        }

        .calendar-holder.hidden {
            opacity: 0;
        }

        @media screen and (max-width: 768px) {

            html {
                font-size: 14px;
            }

            body {
                zoom: 100% !important;
                padding: 1rem;
            }

            .margin-top-15p {
                margin-top: 5%;
            }

            .input {
                width: calc(100vw - 8rem);
                max-width: 20em;
                margin-bottom: 0.5rem;
            }

            div:has(.input) {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }

            .tutorial-tip {
                max-width: 70vw;
                font-size: 12px;
            }

            #tutorial-arrows {
                display: none;
            }

            .share-holder {
                top: 4em;
                left: auto;
                right: 0;
                margin-top: 0;
                margin-left: 0;
                margin-right: calc(-30px - 0.4rem);
            }

            .copy-text {
                order: -1;
            }

            .tooltip-right-up, .tooltip-right-down, .tooltip-left-up, .tooltip-result {
                font-size: 12px;
                margin-left: 0;
                width: 90%;
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                border-radius: 10px 10px 10px 10px;
            }

            .tooltip-left-up {
                margin-top: -1.5rem;
            }

            .tooltip-right-up {
                margin-top: 2.7rem;
            }

            .tooltip-right-down {
                margin-top: 7.5rem;
            }

            .tooltip-result {
                margin-top: 12rem;

            }

            /* Adjust QR code size for mobile */
            .qr {
                width: 40px;
                height: 40px;
            }

            div:has(br) {
                height: 0.5em; /* Smaller space on mobile */
            }
        }

        @media screen and (max-width: 200px) {

            footer {
                display: none
            }

            #main {
                display: none
            }

        }

        @media screen and (max-height: 200px) {

            footer {
                display: none
            }

            #main {
                display: none
            }

        }
    </style>
</head>
