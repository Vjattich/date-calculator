                            "name": "How do I count the days between two dates?",
                            "acceptedAnswer": {"@type": "Answer", "text": "Put one date in the left field and the other date in the right field. The result is the time between them in years, months and days. Click the result to see the same span as a total number of days."}

                            "@type": "Question",
                            "name": "How do I add or subtract days from a date?",

                            "@type": "Question",

                            "@type": "Question",
                            "name": "Does it count working days only?",

    <style>

        :root {
            --bg: orange;
            --ink: #1c1200;
            --cell: #ffb64d;
            --cell-hover: #ffca7a;
            --range: #d98200;
            --faint: #b8791a;
            --muted: #8a5a00;
            --radius: 8px;
            --line: 2px;
        }

        html, body {
            font-family: sans-serif;
            color: var(--ink);
        }

        input, button, textarea, select {
            font-family: inherit;
        }

        .box30 {
            width: 30px;
            height: 30px;
        }

        .input-row {
            position: relative;
            width: fit-content;
            margin: 0 auto;
        }

        .guide-nav {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 10px;
            display: none;
            transition: transform 0.1s ease;
            user-select: none;
            align-items: center;
            justify-content: center;
            height: 40px;
            flex-shrink: 0;
        }

        .guide-nav svg {
            display: block;
        }

        .guide-nav:active {
            transform: scale(0.85);
        }


        .share-holder {
            position: relative;
            display: flex;
            align-items: center;
            white-space: nowrap;
        }

        .share-btn-style {
            background: none;
            border: 0;
            padding: 0;
            line-height: 0;
            cursor: pointer;
        }

        .share {
            transition: transform 0.1s ease-in;
        }

        .share-btn-style:active .share {
            transform: scale(0.9);
        }

        .copy-text {
            position: absolute;
            left: 100%;
            margin-left: 0.5em;
            font-family: sans-serif;
            font-size: 0.7rem;
        }

        .actions {
            position: absolute;
            top: 50%;
            left: 100%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8em;
            margin-left: 0.7em;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .calendar-holder {
            transition: opacity 0.3s ease, visibility 0.3s ease;
            display: flex;
            align-items: center;
        }

        .calendar-btn-style {
            background: none;
            border: 0;
            padding: 0;
            line-height: 0;
            cursor: pointer;
        }

        .calendar {
            transition: transform 0.1s ease-in;
        }

        .calendar-btn-style:active .calendar {
            transform: scale(0.9);
        }

        #timezone {
            display: block;
            margin-top: 0.4em;
            font-size: 0.7em;
            color: var(--muted);
        }

        .calendar-block {
            position: relative;
            width: fit-content;
            margin: 3em auto 0;
        }

        .calendar-view {
            width: fit-content;
            margin: 0 auto;
            font-family: sans-serif;
            font-size: 0.8rem;
            user-select: none;
        }

        .cal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5em;
            margin-bottom: 0.5em;
        }

        .cal-title {
            font-weight: bold;
        }

        .cal-nav {
            background: none;
            border: 0;
            padding: 0 0.5em;
            color: inherit;
            font-size: 1.3em;
            line-height: 1;
            cursor: pointer;
            transition: transform 0.1s ease-in;
        }

        .cal-nav:active {
            transform: scale(0.8);
        }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 2.2em);
            gap: 0.2em;
        }

        .cal-dow {
            font-size: 0.75em;
            line-height: 2;
            text-align: center;
            color: var(--muted);
        }

        .cal-day {
            padding: 0;
            border: 0;
            background: var(--cell);
            color: inherit;
            font: inherit;
            line-height: 2.2em;
            text-align: center;
            cursor: pointer;
            transition: background 0.1s ease-in, transform 0.1s ease-in;
        }

        .cal-day:hover {
            background: var(--cell-hover);
        }

        .cal-day:active {
            transform: scale(0.88);
        }

        .cal-out {
            background: none;
            color: var(--faint);
        }

        .cal-range {
            background: var(--range);
        }

        .cal-today {
            box-shadow: inset 0 0 0 1px var(--ink);
        }

        .cal-sel, .cal-sel:hover {
            background: var(--ink);
            color: var(--bg);
        }


        #tutorial-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
            z-index: 50;
        }

        #tutorial-arrows {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .tutorial-arrow {
            fill: none;
            stroke: var(--ink);
            stroke-width: 2.4;
            stroke-linecap: round;
        }

        .tutorial-arrow-head {
            fill: var(--ink);
            stroke: none;
            opacity: 0;
        }

        .tutorial-tip {
            will-change: opacity, transform;
            position: absolute;
            max-width: 13em;
            padding: 0.45em 0.7em;
            border-radius: var(--radius);
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            font-family: sans-serif;
            font-size: 0.85em;
            line-height: 1.3;
            text-align: center;
            opacity: 0;
            transform: translateY(0.4em) scale(0.96);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .tutorial-tip.show {
            opacity: 1;
            transform: none;
        }

        .tutorial-tip-body {
            display: block;
        }

        .tutorial-key {
            display: inline-block;
            margin-top: 0.45em;
            padding: 0.1em 0.6em;
            border: 1px solid #d0d0d0;
            border-radius: 5px;
            background: #f2f2f2;
            box-shadow: 0 2px 0 #8f8f8f;
            color: var(--ink);
            font-family: sans-serif;
            font-size: 0.75em;
            line-height: 1.6;
            transition: transform 90ms ease, box-shadow 90ms ease;
        }

        .tutorial-key.tutorial-key-down {
            transform: translateY(2px);
            box-shadow: 0 0 0 #8f8f8f;
        }

        .share.tutorial-press, .calendar.tutorial-press {
            transform: scale(0.85);
        }

        #icon-x {
            display: none;
        }

        body.tutorial-on #icon-question {
            display: none;
        }

        body.tutorial-on #icon-x {
            display: block;
        }

        body.tutorial-on .guide-nav {
            display: flex;
        }

        body.tutorial-on #main {
            pointer-events: none;
            user-select: none;
        }

        .input.tutorial-enter {
            animation: tutorial-press 0.4s ease-out;
        }

        @keyframes tutorial-press {
            0% {
                transform: scale(1);
            }
            40% {
                transform: scale(0.97);
                background: #ffe9c2;
            }
            100% {
                transform: scale(1);
            }
        }

        #tutorial-counter {
            font-family: sans-serif;
            font-size: 0.8em;
        }

        @media (prefers-reduced-motion: reduce) {

            .tutorial-tip, .tutorial-arrow, .tutorial-key {
                transition: none;
            }

            .input.tutorial-enter {
                animation: none;
            }

            .result, .actions, .calendar-holder, .calendar-view, .cal-day, .cal-nav {
                transition: none;
            }
        }

        .box40 {
            width: 40px;
            height: 40px;
        }

        /* readable by search engines and screen readers, out of the way of the design */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            margin: -1px;
            padding: 0;
            overflow: hidden;
            clip: rect(0 0 0 0);
            clip-path: inset(50%);
            white-space: nowrap;
            border: 0;
        }



        html {
            font-size: 16px;
        }

        footer {
            position: fixed;
            bottom: 1em;
            left: 50%;
            transform: translateX(-50%);
            width: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5em;
            padding: 0 1em;
            z-index: 10;
        }

        .input {
            min-width: 6em;
            min-height: 1em;
            width: 8em;
            border: var(--line) solid var(--ink);
            padding: 0.15em 0.4em;
            transition: all 0.1s ease-in;
            font-size: 1em;
        }

        .font-size-20 {
            font-size: 20px;
        }

        .margin-top-15p {
            margin-top: 10%
        }

        .center {
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .background-orange {
            background: var(--bg);
        }

        /* a solid tile the size of the github mark, with the word inside it */
        .tg, .question-mark {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px;
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            background: var(--ink);
            color: var(--bg);
            text-decoration: none;
            cursor: pointer;
        }

        .tg svg {
            width: 20px;
            height: 20px;
            fill: var(--bg);
        }

        .tg-label {
            font-family: sans-serif;
            font-size: 0.55rem;
            line-height: 1;
            letter-spacing: 0.04em;
        }

        hr {
            display: block;
            text-align: center;
            width: 8em;
            border: 0;
            border-top: 0.1em solid #123455;
            margin: 0.3em auto;
            padding: 0;
        }

        .guide {
            font-family: sans-serif;
            -webkit-transition: opacity 1s;
            -moz-transition: opacity 1s;
            -o-transition: opacity 1s;
            transition: opacity 1s;
        }

        .result {
            width: fit-content;
            max-width: 100%;
            margin: 1.2em auto 6em;
            transition: opacity 0.3s ease;
        }

        .result.result-out {
            opacity: 0;
        }

        .result-span {
            font-size: 20px;
        }

        .opacity-0 {
            opacity: 0;
        }

        .opacity-1 {
            opacity: 100;
        }

        .tooltip-right-up {
            position: absolute;
            padding: 5px;
            margin-top: -1.8em;
            margin-left: 8.7em;
            width: auto;
            border-radius: var(--radius) var(--radius) var(--radius) 0px;
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-right-down {
            position: absolute;
            padding: 5px;
            margin-top: 1.8em;
            margin-left: 8.7em;
            width: auto;
            border-radius: 0px var(--radius) var(--radius) var(--radius);
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-result {
            position: absolute;
            padding: 5px;
            margin-top: 5em;
            margin-left: -12em;
            width: auto;
            border-radius: var(--radius) 0px var(--radius) var(--radius);
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .tooltip-left-up {
            position: absolute;
            padding: 5px;
            margin-top: -3rem;
            margin-left: -30rem;
            width: auto;
            border-radius: var(--radius) var(--radius) 0px var(--radius);
            border: 1px solid #aeaeae;
            background-color: var(--ink);
            color: var(--bg);
            z-index: 1;
            -webkit-transition: opacity 0.5s;
            -moz-transition: opacity 0.5s;
            -o-transition: opacity 0.5s;
            transition: opacity 0.5s;
        }

        .hidden {
            visibility: hidden
        }

        .actions.hidden, .calendar-holder.hidden {
            opacity: 0;
        }

        /* the guide points at these, so it needs them on screen even with no result */
        body.tutorial-on .actions.hidden, body.tutorial-on .calendar-holder.hidden {
            visibility: visible;
            opacity: 1;
        }

        @media screen and (max-width: 768px) {

            html {
                font-size: 14px;
            }

            body {
                zoom: 100% !important;
                padding: 1rem;
            }

            .margin-top-15p {
                margin-top: 5%;
            }

            .input {
                width: calc(100vw - 8rem);
                max-width: 20em;
                margin-bottom: 0.5rem;
            }

            div:has(.input) {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.5rem;
            }

            .tutorial-tip {
                max-width: 70vw;
                font-size: 12px;
            }

            #tutorial-arrows {
                display: none;
            }

            .copy-text {
                top: 100%;
                left: auto;
                right: 0;
                margin-top: 0.4em;
                margin-left: 0;
            }

            .actions {
                margin-left: 0.4em;
            }

            .calendar-block {
                margin: 2em auto 0;
            }

            .result {
                margin: 1em auto 5em;
            }

            .calendar-view {
                font-size: 0.9rem;
            }

            .cal-grid {
                grid-template-columns: repeat(7, 2.6em);
            }

            .tooltip-right-up, .tooltip-right-down, .tooltip-left-up, .tooltip-result {
                font-size: 12px;
                margin-left: 0;
                width: 90%;
                position: fixed;
                left: 50%;
                transform: translateX(-50%);
                border-radius: var(--radius);
            }

            .tooltip-left-up {
                margin-top: -1.5rem;
            }

            .tooltip-right-up {
                margin-top: 2.7rem;
            }

            .tooltip-right-down {
                margin-top: 7.5rem;
            }

            .tooltip-result {
                margin-top: 12rem;

            }

            div:has(br) {
                height: 0.5em; /* Smaller space on mobile */
            }
        }

        @media screen and (max-width: 200px) {

            footer {
                display: none
            }

            #main {
                display: none
            }

        }

        @media screen and (max-height: 200px) {

            footer {
                display: none
            }

            #main {
                display: none
            }

        }
    </style>
</head>
